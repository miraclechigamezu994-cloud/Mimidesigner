<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111116">
<title>Mimi Designer Studio</title>
<style>
:root{--bg:#111116;--panel:#1c1c24;--line:#33333e;--accent:#b9ff66;--text:#f6f6fa;--muted:#a0a0b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#15151b;gap:10px;position:sticky;top:0;z-index:5}
.brand{font-weight:900;font-size:20px;letter-spacing:-1px}.brand span{color:var(--accent)}.small{color:var(--muted);font-size:11px}
.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.primary{background:var(--accent);color:#171717;border:0;font-weight:800}
.app{display:grid;grid-template-columns:76px minmax(0,1fr) 270px;min-height:calc(100dvh - 65px)}
.tools{border-right:1px solid var(--line);padding:10px 6px;display:flex;flex-direction:column;gap:5px;background:#15151b}
.tool{color:var(--muted);border:1px solid transparent;background:transparent;padding:10px 2px;border-radius:10px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px}
.tool b{font-size:22px;font-weight:500}.tool.active{background:#2a3222;color:var(--accent);border-color:#485837}
.workspace{min-width:0;padding:14px;display:flex;flex-direction:column;gap:12px}.topbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.topbar input{max-width:160px;min-width:80px}
input,select{background:#111116;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;max-width:100%}
.canvas-area{flex:1;min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background-color:#191920;background-image:radial-gradient(#393943 1px,transparent 1px);background-size:18px 18px}
canvas{width:min(100%,700px);height:auto;max-height:72vh;object-fit:contain;background:white;box-shadow:0 12px 50px #0006;touch-action:none}
.hint{text-align:center;color:var(--muted);font-size:11px}.panel{background:#18181f;border-left:1px solid var(--line);padding:16px;min-width:0}.panel h3{font-size:16px;margin:0 0 6px}.panel p{font-size:12px;color:var(--muted);line-height:1.5}
.section{padding:13px 0;border-bottom:1px solid var(--line)}.section label{display:block;font-size:12px;color:#c7c7d1;margin-bottom:7px}.field{width:100%;margin-bottom:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.swatch{width:100%;aspect-ratio:1;border:2px solid #ffffff22;border-radius:9px;padding:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.template{background:#24242d;border:1px solid var(--line);color:white;border-radius:10px;padding:8px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.template strong{font-size:24px}.template span{font-size:11px}
.range{width:100%;padding:0;accent-color:var(--accent)}.layer{display:flex;align-items:center;gap:5px;padding:8px;background:#24242d;border-radius:8px;margin-top:6px;font-size:12px}.layer button{margin-left:auto}.hidden{display:none!important}#notice{font-size:12px;color:var(--accent);min-height:16px}
@media(max-width:850px){.app{grid-template-columns:1fr;padding-bottom:68px}.tools{position:fixed;z-index:10;bottom:0;left:0;right:0;flex-direction:row;justify-content:flex-start;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:5px}.tool{min-width:58px;padding:6px 3px}.tool b{font-size:19px}.panel{border-left:0;border-top:1px solid var(--line)}.canvas-area{min-height:290px}canvas{max-height:55vh}header{padding:12px}}
</style>
</head>
<body>
<header>
 <div><div class="brand">Mimi<span>Designer</span> ✦</div><div class="small">YOUR CREATIVE STUDIO</div></div>
 <div style="display:flex;gap:6px"><button class="btn" id="undo" aria-label="Undo">↶</button><button class="btn" id="redo" aria-label="Redo">↷</button><button class="btn primary" id="download">↓ PNG</button></div>
</header>
<div class="app">
 <nav class="tools" id="tools">
  <button class="tool active" data-tool="select"><b>↖</b>Select</button><button class="tool" data-tool="text"><b>Tt</b>Text</button><button class="tool" data-tool="colors"><b>◉</b>Colors</button><button class="tool" data-tool="logos"><b>✦</b>Logos</button><button class="tool" data-tool="shapes"><b>◇</b>Shapes</button><button class="tool" data-tool="images"><b>▧</b>Images</button><button class="tool" data-tool="templates"><b>▣</b>Designs</button><button class="tool" data-tool="layers"><b>▤</b>Layers</button><button class="tool" data-tool="background"><b>◐</b>Canvas</button>
 </nav>
 <main class="workspace">
  <div class="topbar"><input id="designName" value="My Design" aria-label="Design name"><button class="btn" id="clear">Clear</button><button class="btn" id="duplicate">Duplicate</button><button class="btn" id="delete">Delete</button></div>
  <div class="canvas-area"><canvas id="canvas" width="800" height="800" aria-label="Design canvas"></canvas></div>
  <div class="hint">Select an object and drag it to move it. Use the controls to customize it.</div><div id="notice"></div>
 </main>
 <aside class="panel"><h3 id="panelTitle">Welcome to Mimi ✦</h3><p id="panelDesc">Create a design, select an object, and make it yours.</p><div id="panelContent"></div></aside>
</div>
<input type="file" id="imageInput" accept="image/*" hidden>
<script>
(()=>{
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),panel=$('panelContent');
let objects=[],selected=null,activeTool='select',background='#ffffff',history=[],future=[],dragging=false,dragOffset={x:0,y:0},serial=0;
const palette=['#111111','#ffffff','#ff477e','#ff8a00','#ffd43b','#b9ff66','#00c2a8','#38a5ff','#635bff','#b76cff','#ffb6c8','#8b5e3c','#737373','#17324d','#f2e8cf','#e63946','#457b9d','#2a9d8f','#e9c46a','#264653'];
const fonts=['Arial','Georgia','Impact','Verdana','Trebuchet MS','Courier New','Times New Roman','Comic Sans MS'];
function notify(s){$('notice').textContent=s}function uid(){return ++serial}
function saveHistory(){history.push(JSON.stringify({objects:objects.map(o=>({...o,image:undefined})),background,serial}));if(history.length>40)history.shift();future=[]}
function restore(data){const s=JSON.parse(data);objects=s.objects; background=s.background;serial=Math.max(serial,s.serial||0);selected=null;render();renderPanel()}
function undo(){if(history.length<2)return;future.push(history.pop());restore(history[history.length-1])}
function redo(){if(!future.length)return;const s=future.pop();history.push(s);restore(s)}
function addObject(o){saveHistory();o.id=uid();o.x??=400;o.y??=400;o.opacity??=1;o.rotation??=0;o.color??='#111111';objects.push(o);selected=o.id;render();renderPanel()}
function selectedObject(){return objects.find(o=>o.id===selected)}
function textObject(text,x=400,y=400,size=64,color='#111111'){return{type:'text',text,x,y,size,color,font:'Arial',bold:true,italic:false,align:'center',opacity:1,rotation:0}}
function shapeObject(shape,color='#b9ff66'){return{type:'shape',shape,x:400,y:400,w:200,h:150,color,stroke:'#111111',outline:false,opacity:1,rotation:0}}
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(typeof background==='string'){ctx.fillStyle=background;ctx.fillRect(0,0,canvas.width,canvas.height)}
 else{ctx.fillStyle=background;ctx.fillRect(0,0,canvas.width,canvas.height)}
 for(const o of objects){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,o.opacity??1));ctx.translate(o.x,o.y);ctx.rotate((o.rotation||0)*Math.PI/180);
  if(o.type==='text'){ctx.fillStyle=o.color;ctx.font=`${o.italic?'italic ':''}${o.bold?'bold ':''}${o.size}px "${o.font}"`;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';const lines=String(o.text).split('\n'),lh=o.size*1.2;lines.forEach((line,i)=>ctx.fillText(line,0,(i-(lines.length-1)/2)*lh,canvas.width-60))}
  else if(o.type==='image'&&o.image){ctx.drawImage(o.image,-o.w/2,-o.h/2,o.w,o.h)}
  else if(o.type==='shirt')drawShirt(o);else drawShape(o);
  if(o.id===selected){const b=getBounds(o);ctx.globalAlpha=1;ctx.strokeStyle='#745cff';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.setLineDash([]);ctx.fillStyle='#745cff';ctx.fillRect(b.x+b.w-5,b.y+b.h-5,10,10)}
  ctx.restore()
 }
}
function drawShape(o){ctx.beginPath();const w=o.w||150,h=o.h||150;
 switch(o.shape){case'circle':ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);break;case'triangle':ctx.moveTo(0,-h/2);ctx.lineTo(w/2,h/2);ctx.lineTo(-w/2,h/2);ctx.closePath();break;case'diamond':ctx.moveTo(0,-h/2);ctx.lineTo(w/2,0);ctx.lineTo(0,h/2);ctx.lineTo(-w/2,0);ctx.closePath();break;case'star':for(let i=0;i<10;i++){const r=i%2?w*.23:w*.5,a=-Math.PI/2+i*Math.PI/5,x=Math.cos(a)*r,y=Math.sin(a)*r;if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();break;case'line':ctx.moveTo(-w/2,0);ctx.lineTo(w/2,0);break;case'arrow':ctx.moveTo(-w/2,0);ctx.lineTo(w/2,0);ctx.moveTo(w/2-30,-25);ctx.lineTo(w/2,0);ctx.lineTo(w/2-30,25);break;case'hexagon':for(let i=0;i<6;i++){const a=i*Math.PI/3,x=Math.cos(a)*w/2,y=Math.sin(a)*h/2;if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();break;default:ctx.rect(-w/2,-h/2,w,h)}
 if(o.shape==='line'||o.shape==='arrow'||o.outline){ctx.strokeStyle=o.stroke||o.color;ctx.lineWidth=o.strokeWidth||7;ctx.stroke()}else{ctx.fillStyle=o.color;ctx.fill()}
}
function drawShirt(o){ctx.save();ctx.scale(o.scale||1,o.scale||1);ctx.fillStyle=o.color||'#eee';ctx.strokeStyle='#777';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-100,-130);ctx.lineTo(-175,-85);ctx.lineTo(-220,-5);ctx.lineTo(-160,30);ctx.lineTo(-130,-15);ctx.lineTo(-130,180);ctx.lineTo(130,180);ctx.lineTo(130,-15);ctx.lineTo(160,30);ctx.lineTo(220,-5);ctx.lineTo(175,-85);ctx.lineTo(100,-130);ctx.quadraticCurveTo(0,-70,-100,-130);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function getBounds(o){if(o.type==='text'){ctx.save();ctx.font=`${o.italic?'italic ':''}${o.bold?'bold ':''}${o.size}px "${o.font}"`;const lines=String(o.text).split('\n'),w=Math.max(30,...lines.map(t=>ctx.measureText(t).width))+12,h=lines.length*o.size*1.2+8;ctx.restore();return{x:o.x-w/2,y:o.y-h/2,w,h}}return{x:o.x-(o.w||150)/2,y:o.y-(o.h||150)/2,w:o.w||150,h:o.h||150}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function hit(p,o){const b=getBounds(o);return p.x>=b.x-8&&p.x<=b.x+b.w+8&&p.y>=b.y-8&&p.y<=b.y+b.h+8}
canvas.addEventListener('pointerdown',e=>{const p=point(e);if(activeTool!=='select')return;for(let i=objects.length-1;i>=0;i--)if(hit(p,objects[i])){selected=objects[i].id;dragging=true;dragOffset={x:p.x-objects[i].x,y:p.y-objects[i].y};canvas.setPointerCapture(e.pointerId);render();renderPanel();return}selected=null;render();renderPanel()});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const o=selectedObject();if(!o)return;const p=point(e);o.x=p.x-dragOffset.x;o.y=p.y-dragOffset.y;render()});
canvas.addEventListener('pointerup',()=>{if(dragging){dragging=false;saveHistory();renderPanel()}});canvas.addEventListener('pointercancel',()=>dragging=false);
function section(title,html){return`<div class="section"><label>${title}</label>${html}</div>`}
function field(label,html){return`<label>${label}</label>${html}`}
function swatches(target='object'){return`<div class="swatches">${palette.map(c=>`<button class="swatch" title="${c}" style="background:${c}" data-color="${c}" data-target="${target}"></button>`).join('')}</div><div style="margin-top:10px"><input type="color" id="customColor" value="#b9ff66" style="width:100%;height:42px"></div>`}
function renderPanel(){
 const o=selectedObject();$('panelTitle').textContent=o?'Edit object':'Design tools';$('panelDesc').textContent=o?'Adjust the selected object using the controls below.':'Choose a tool, add something to your canvas, and customize it.';let html='';
 if(activeTool==='text')html=section('ADD TEXT',`<input class="field" id="newText" value="Your Text" placeholder="Enter your text"><button class="btn primary" id="addText">+ Add text</button>`)+section('QUICK TEXT',`<button class="btn" data-text="YOUR BRAND">Brand</button> <button class="btn" data-text="EST. 2026">Subtitle</button> <button class="btn" data-text="★">Symbol</button>`);
 else if(activeTool==='colors')html=section('COLOR PALETTE',swatches())+section('BACKGROUND',swatches('background'))+section('CUSTOM GRADIENT',`<input type="color" id="grad1" value="#ffffff"><input type="color" id="grad2" value="#b9ff66"><button class="btn" id="applyGradient">Apply gradient</button>`);
 else if(activeTool==='shapes'){const shapes=[['rect','▰','Rectangle'],['circle','●','Circle'],['triangle','▲','Triangle'],['diamond','◆','Diamond'],['star','★','Star'],['line','／','Line'],['arrow','➜','Arrow'],['hexagon','⬡','Hexagon']];html=section('ADD SHAPE',`<div class="grid">${shapes.map(([s,i,n])=>`<button class="template" data-shape="${s}"><strong>${i}</strong><span>${n}</span></button>`).join('')}</div>`)}
 else if(activeTool==='logos'){const logos=[['✦','Star mark'],['◉','Orbit'],['❖','Diamond'],['✿','Flower'],['⬡','Hexagon'],['♛','Royal'],['∞','Infinity'],['☼','Sun'],['M','Monogram'],['⚡','Energy'],['♥','Heart'],['✧','Sparkle']];html=section('READY-MADE LOGOS',`<div class="grid">${logos.map(([s,n])=>`<button class="template" data-logo="${s}"><strong>${s}</strong><span>${n}</span></button>`).join('')}</div><p>These are editable starter marks. Customize their colors and size.</p>`)}
 else if(activeTool==='images')html=section('UPLOAD IMAGE',`<p>Upload a photo, drawing, or transparent PNG.</p><button class="btn primary" id="upload">Choose image</button>`)+section('TIP',`<p>Transparent PNG images work especially well for logos and clothing graphics.</p>`);
 else if(activeTool==='templates')html=section('START A DESIGN',`<div class="grid"><button class="template" data-template="logo"><strong>✦</strong><span>Logo</span></button><button class="template" data-template="app"><strong>▣</strong><span>App icon</span></button><button class="template" data-template="shirt"><strong>♧</strong><span>T-shirt</span></button><button class="template" data-template="poster"><strong>▤</strong><span>Poster</span></button><button class="template" data-template="business"><strong>✧</strong><span>Brand card</span></button><button class="template" data-template="minimal"><strong>○</strong><span>Minimal</span></button></div>`);
 else if(activeTool==='background')html=section('CANVAS BACKGROUND',swatches('background'))+section('CANVAS SIZE',`<button class="btn" data-size="square">Square 800×800</button> <button class="btn" data-size="story">Story 800×1200</button> <button class="btn" data-size="wide">Wide 1200×800</button><p>Resize your canvas for different design formats.</p>`);
 else if(activeTool==='layers')html=section('YOUR LAYERS',`<button class="btn" id="bringFront">Bring forward</button> <button class="btn" id="sendBack">Send backward</button><div id="layerList"></div>`);
 else html=section('QUICK START',`<button class="btn primary field" data-go="text">＋ Add text</button><button class="btn field" data-go="logos">✦ Browse logos</button><button class="btn field" data-go="shapes">◇ Add shapes</button><button class="btn field" data-go="templates">▣ Start from a template</button>`)+section('HOW TO USE',`<p>1. Add text, shapes, logos, or images.</p><p>2. Select an object and drag it to move.</p><p>3. Change colors, size, opacity, and rotation.</p><p>4. Export your finished design as a PNG.</p>`);
 if(o)html+=objectControls(o);panel.innerHTML=html;wirePanel();
 if(activeTool==='layers')$('layerList').innerHTML=objects.slice().reverse().map(obj=>`<div class="layer"><span>${obj.type==='text'?'T':obj.type==='image'?'▧':'◇'}</span><span>${escapeHTML(obj.type==='text'?obj.text:obj.type==='image'?'Image':obj.shape||'T-shirt')}</span><button class="btn" data-select="${obj.id}">Select</button></div>`).join('')||'<p>No layers yet.</p>';
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function objectControls(o){
 let h=section('POSITION & SIZE',`<div class="two"><div>${field('X position',`<input class="field" type="number" id="objX" value="${Math.round(o.x)}">`)}</div><div>${field('Y position',`<input class="field" type="number" id="objY" value="${Math.round(o.y)}">`)}</div></div>${field('Size',`<input class="range" type="range" id="objSize" min="10" max="500" value="${Math.min(500,Math.round(o.type==='text'?o.size:o.w||150))}">`)}${field('Rotation',`<input class="range" type="range" id="objRotation" min="-180" max="180" value="${o.rotation||0}">`)}${field('Opacity / brightness',`<input class="range" type="range" id="objOpacity" min="0" max="100" value="${Math.round((o.opacity??1)*100)}">`)}`);
 if(o.type==='text')h+=section('TEXT SETTINGS',`${field('Your text',`<input class="field" id="objText" value="${escapeHTML(o.text)}">`)}${field('Font',`<select class="field" id="objFont">${fonts.map(f=>`<option ${o.font===f?'selected':''}>${f}</option>`).join('')}</select>`)}<div class="two"><button class="btn" id="boldBtn">B Bold</button><button class="btn" id="italicBtn">I Italic</button></div>${field('Alignment',`<select class="field" id="objAlign"><option value="left" ${o.align==='left'?'selected':''}>Left</option><option value="center" ${o.align==='center'?'selected':''}>Center</option><option value="right" ${o.align==='right'?'selected':''}>Right</option></select>`)}`);
 else if(o.type==='shape')h+=section('SHAPE SETTINGS',`<label><input type="checkbox" id="objOutline" ${o.outline?'checked':''}> Outline only</label>${field('Outline color',`<input type="color" id="objStroke" value="${o.stroke||'#111111'}">`)}${field('Height',`<input class="range" id="objHeight" type="range" min="10" max="500" value="${o.h||150}">`)}`);
 else if(o.type==='image')h+=section('IMAGE',`<p>Use the size slider above to resize this image.</p>`);
 else if(o.type==='shirt')h+=section('CLOTHING COLOR',swatches());
 return h+section('OBJECT COLOR',swatches())+`<button class="btn field" id="objDuplicate">Duplicate object</button>`
}
function wirePanel(){
 panel.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.target==='background')background=b.dataset.color;else{const o=selectedObject();if(!o){notify('Select an object first.');return}o.color=b.dataset.color}saveHistory();render();renderPanel()}));
 const custom=$('customColor');if(custom){custom.addEventListener('input',e=>{const o=selectedObject();if(o)o.color=e.target.value;render()});custom.addEventListener('change',()=>{saveHistory();renderPanel()})}
 if($('addText'))$('addText').onclick=()=>{addObject(textObject($('newText').value||'Your Text'));notify('Text added!')};
 panel.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>addObject(textObject(b.dataset.text)));
 panel.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>addObject(shapeObject(b.dataset.shape)));
 panel.querySelectorAll('[data-logo]').forEach(b=>b.onclick=()=>{const o=textObject(b.dataset.logo,400,400,140,'#635bff');addObject(o)});
 panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTool(b.dataset.go));
 panel.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.select);setTool('layers');render();renderPanel()});
 if($('upload'))$('upload').onclick=()=>$('imageInput').click();
 if($('applyGradient'))$('applyGradient').onclick=()=>{const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);g.addColorStop(0,$('grad1').value);g.addColorStop(1,$('grad2').value);background=g;saveHistory();render();renderPanel()};
 const bind=(id,fn,event='input')=>{const el=$(id);if(!el)return;el.addEventListener(event,()=>{const o=selectedObject();if(!o)return;fn(o,el);render();if(event==='change')saveHistory()})};
 bind('objX',(o,e)=>o.x=Number(e.value),'change');bind('objY',(o,e)=>o.y=Number(e.value),'change');
 bind('objSize',(o,e)=>{if(o.type==='text')o.size=Number(e.value);else if(o.type==='shirt')o.scale=Number(e.value)/150;else{const old=o.w||150,r=Number(e.value)/old;o.w=Number(e.value);o.h=Math.max(10,(o.h||150)*r)}});
 bind('objRotation',(o,e)=>o.rotation=Number(e.value));bind('objOpacity',(o,e)=>o.opacity=Number(e.value)/100);
 bind('objText',(o,e)=>{if(o.type==='text')o.text=e.value});bind('objFont',(o,e)=>{if(o.type==='text')o.font=e.value},'change');bind('objAlign',(o,e)=>{if(o.type==='text')o.align=e.value},'change');bind('objHeight',(o,e)=>o.h=Number(e.value));bind('objStroke',(o,e)=>o.stroke=e.value,'change');bind('objOutline',(o,e)=>o.outline=e.checked,'change');
 if($('boldBtn'))$('boldBtn').onclick=()=>{const o=selectedObject();if(o){o.bold=!o.bold;saveHistory();render();renderPanel()}};
 if($('italicBtn'))$('italicBtn').onclick=()=>{const o=selectedObject();if(o){o.italic=!o.italic;saveHistory();render();renderPanel()}};
 if($('objDuplicate'))$('objDuplicate').onclick=duplicateObject;
 if($('bringFront'))$('bringFront').onclick=()=>{const i=objects.findIndex(o=>o.id===selected);if(i>=0){objects.push(objects.splice(i,1)[0]);saveHistory();render();renderPanel()}};
 if($('sendBack'))$('sendBack').onclick=()=>{const i=objects.findIndex(o=>o.id===selected);if(i>=0){objects.unshift(objects.splice(i,1)[0]);saveHistory();render();renderPanel()}};
 panel.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const dims={square:[800,800],story:[800,1200],wide:[1200,800]}[b.dataset.size];canvas.width=dims[0];canvas.height=dims[1];saveHistory();render();renderPanel()})
}
function setTool(t){activeTool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));renderPanel()}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
function duplicateObject(){const o=selectedObject();if(!o)return;const copy={...o,id:undefined,image:o.image,x:o.x+25,y:o.y+25};addObject(copy)}
$('duplicate').onclick=duplicateObject;$('delete').onclick=()=>{if(selected===null)return;saveHistory();objects=objects.filter(o=>o.id!==selected);selected=null;render();renderPanel();notify('Object deleted.')};
$('clear').onclick=()=>{if(!confirm('Clear all objects from your canvas?'))return;saveHistory();objects=[];selected=null;render();renderPanel()};
$('undo').onclick=undo;$('redo').onclick=redo;
$('imageInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){notify('Please select an image file.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const r=Math.min(400/img.width,400/img.height,1);addObject({type:'image',image:img,src:reader.result,x:400,y:400,w:img.width*r,h:img.height*r,color:'#111',opacity:1,rotation:0});notify('Image added!')};img.src=reader.result};reader.readAsDataURL(file);e.target.value=''});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-template]');if(t){const kind=t.dataset.template;saveHistory();objects=[];selected=null;background='#ffffff';
 if(kind==='logo'){objects.push({...textObject('✦',400,330,170,'#635bff'),id:uid()});objects.push({...textObject('YOUR BRAND',400,500,62),id:uid()})}
 else if(kind==='app'){background='#eeeaff';objects.push({...shapeObject('rect','#635bff'),id:uid(),w:360,h:360});objects.push({...textObject('M',400,400,200,'#ffffff'),id:uid()})}
 else if(kind==='shirt'){objects.push({type:'shirt',id:uid(),x:400,y:420,scale:1,color:'#eeeeee',opacity:1,rotation:0});objects.push({...textObject('YOUR DESIGN',400,405,34,'#111111'),id:uid()})}
 else if(kind==='poster'){background='#111116';objects.push({...textObject('MAKE IT\\nUNFORGETTABLE',400,330,72,'#b9ff66'),id:uid()});objects.push({...textObject('YOUR MESSAGE HERE',400,520,30,'#ffffff'),id:uid()})}
 else if(kind==='business'){objects.push({...shapeObject('circle','#b9ff66'),id:uid(),w:180,h:180});objects.push({...textObject('M',400,400,100),id:uid()});objects.push({...textObject('YOUR BRAND',400,550,48),id:uid()})}
 else{objects.push({...shapeObject('circle','#b9ff66'),id:uid(),w:250,h:250});objects.push({...textObject('✦',400,400,110),id:uid()})}
 render();renderPanel();notify('Template added!')}
});
$('download').onclick=()=>{
 const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const c=out.getContext('2d');
 if(typeof background==='string'){c.fillStyle=background;c.fillRect(0,0,out.width,out.height)}else{c.fillStyle=background;c.fillRect(0,0,out.width,out.height)}
 for(const o of objects){c.save();c.globalAlpha=o.opacity??1;c.translate(o.x,o.y);c.rotate((o.rotation||0)*Math.PI/180);
 if(o.type==='text'){c.fillStyle=o.color;c.font=`${o.italic?'italic ':''}${o.bold?'bold ':''}${o.size}px "${o.font}"`;c.textAlign=o.align||'center';c.textBaseline='middle';const lines=String(o.text).split('\n');lines.forEach((line,i)=>c.fillText(line,0,(i-(lines.length-1)/2)*o.size*1.2,out.width-60))}
 else if(o.type==='image'&&o.image)c.drawImage(o.image,-o.w/2,-o.h/2,o.w,o.h);
 else if(o.type==='shirt')drawShirtExport(c,o);else drawShapeExport(c,o);
 c.restore()}
 const a=document.createElement('a');a.download=(($('designName').value||'mimi-design').trim().replace(/[^a-z0-9-_]+/gi,'-'))+'.png';a.href=out.toDataURL('image/png');a.click();notify('PNG export ready!')
};
function drawShapeExport(c,o){c.beginPath();const w=o.w||150,h=o.h||150;switch(o.shape){case'circle':c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);break;case'triangle':c.moveTo(0,-h/2);c.lineTo(w/2,h/2);c.lineTo(-w/2,h/2);c.closePath();break;case'diamond':c.moveTo(0,-h/2);c.lineTo(w/2,0);c.lineTo(0,h/2);c.lineTo(-w/2,0);c.closePath();break;case'star':for(let i=0;i<10;i++){const r=i%2?w*.23:w*.5,a=-Math.PI/2+i*Math.PI/5,x=Math.cos(a)*r,y=Math.sin(a)*r;if(!i)c.moveTo(x,y);else c.lineTo(x,y)}c.closePath();break;case'line':c.moveTo(-w/2,0);c.lineTo(w/2,0);break;case'arrow':c.moveTo(-w/2,0);c.lineTo(w/2,0);c.moveTo(w/2-30,-25);c.lineTo(w/2,0);c.lineTo(w/2-30,25);break;case'hexagon':for(let i=0;i<6;i++){const a=i*Math.PI/3,x=Math.cos(a)*w/2,y=Math.sin(a)*h/2;if(!i)c.moveTo(x,y);else c.lineTo(x,y)}c.closePath();break;default:c.rect(-w/2,-h/2,w,h)}if(o.shape==='line'||o.shape==='arrow'||o.outline){c.strokeStyle=o.stroke||o.color;c.lineWidth=o.strokeWidth||7;c.stroke()}else{c.fillStyle=o.color;c.fill()}}
function drawShirtExport(c,o){c.save();c.scale(o.scale||1,o.scale||1);c.fillStyle=o.color||'#eee';c.strokeStyle='#777';c.lineWidth=3;c.beginPath();c.moveTo(-100,-130);c.lineTo(-175,-85);c.lineTo(-220,-5);c.lineTo(-160,30);c.lineTo(-130,-15);c.lineTo(-130,180);c.lineTo(130,180);c.lineTo(130,-15);c.lineTo(160,30);c.lineTo(220,-5);c.lineTo(175,-85);c.lineTo(100,-130);c.quadraticCurveTo(0,-70,-100,-130);c.closePath();c.fill();c.stroke();c.restore()}
saveHistory();render();renderPanel();
})();
</script>
</body>
