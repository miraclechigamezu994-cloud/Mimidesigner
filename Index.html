<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimi Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;700&family=Pacifico&family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 60px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 0.85rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .main-container {
            flex: 1;
            display: flex;
            height: calc(100vh - 60px);
            position: relative;
        }

        /* Sidebar Tools */
        .sidebar {
            width: 80px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            gap: 15px;
            z-index: 10;
        }

        .tool-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .tool-btn span {
            font-size: 0.65rem;
            font-weight: 500;
        }

        .tool-btn:hover, .tool-btn.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
        }

        /* Tool Panels Drawer */
        .tool-panel {
            width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: none;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            z-index: 5;
            overflow-y: auto;
        }

        .tool-panel.active {
            display: flex;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"], select {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .range-slider {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
        }

        /* Colors Grid */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .color-swatch {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.active {
            border-color: white;
        }

        /* Presets Grid (Logos & Shapes) */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .preset-card {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .preset-card:hover {
            border-color: var(--primary);
            color: var(--text-main);
            background: rgba(99, 102, 241, 0.05);
        }

        .preset-card svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Canvas Workspace */
        .workspace {
            flex: 1;
            background: #090d16;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .canvas-container {
            width: 500px;
            height: 500px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Movable/Resizable Canvas Elements */
        .canvas-element {
            position: absolute;
            cursor: move;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: 2px dashed transparent;
            transition: border 0.2s;
        }

        .canvas-element:hover, .canvas-element.selected {
            border-color: var(--primary);
        }

        .canvas-element svg {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .canvas-text {
            font-size: 2rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Responsive adjustments for mobile/smaller screens */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100vw;
                height: 70px;
                flex-direction: row;
                justify-content: space-around;
                padding: 0 10px;
                border-right: none;
                border-top: 1px solid var(--border-color);
            }
            .tool-panel {
                width: 100vw;
                height: calc(100vh - 130px);
                position: absolute;
                bottom: 70px;
                left: 0;
            }
            .canvas-container {
                width: 320px;
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Mimi Designer
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" id="clear-btn">Clear All</button>
            <button class="btn" id="export-btn">Export Design</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar Navigation Icons -->
        <div class="sidebar">
            <button class="tool-btn active" data-target="text-panel">
                <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
                <span>Text</span>
            </button>
            <button class="tool-btn" data-target="colors-panel">
                <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.92-1.92C9.23 19.26 10.58 19.5 12 19.5c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
                <span>Colors</span>
            </button>
            <button class="tool-btn" data-target="logos-panel">
                <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99z"/></svg>
                <span>Logos</span>
            </button>
            <button class="tool-btn" data-target="shapes-panel">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
                <span>Shapes</span>
            </button>
        </div>

        <!-- 1. Text Panel -->
        <div class="tool-panel active" id="text-panel">
            <div class="panel-title">Text Customization</div>
            <div class="control-group">
                <label>Add / Edit Text</label>
                <input type="text" id="text-input" placeholder="Type your brand name..." value="Mimi Brand">
            </div>
            <div class="control-group">
                <label>Font Style</label>
                <select id="font-select">
                    <option value="'Poppins', sans-serif">Modern Sans</option>
                    <option value="'Roboto Mono', monospace">Tech Mono</option>
                    <option value="'Pacifico', cursive">Handwritten Script</option>
                    <option value="'Cinzel', serif">Luxury Serif</option>
                </select>
            </div>
            <div class="control-group">
                <label>Font Size</label>
                <div class="range-slider">
                    <input type="range" id="font-size-range" min="12" max="72" value="32">
                </div>
            </div>
            <div class="control-group">
                <label>Brightness / Opacity</label>
                <div class="range-slider">
                    <input type="range" id="text-opacity-range" min="0.2" max="1" step="0.1" value="1">
                </div>
            </div>
            <button class="btn" id="add-text-btn">Add Text to Canvas</button>
        </div>

        <!-- 2. Colors Panel -->
        <div class="tool-panel" id="colors-panel">
            <div class="panel-title">Color Palette</div>
            <div class="control-group">
                <label>Select Accent / Element Color</label>
                <div class="color-grid" id="color-grid">
                    <div class="color-swatch active" style="background: #0f172a;" data-color="#0f172a"></div>
                    <div class="color-swatch" style="background: #6366f1;" data-color="#6366f1"></div>
                    <div class="color-swatch" style="background: #ec4899;" data-color="#ec4899"></div>
                    <div class="color-swatch" style="background: #f59e0b;" data-color="#f59e0b"></div>
                    <div class="color-swatch" style="background: #10b981;" data-color="#10b981"></div>
                    <div class="color-swatch" style="background: #3b82f6;" data-color="#3b82f6"></div>
                    <div class="color-swatch" style="background: #8b5cf6;" data-color="#8b5cf6"></div>
                    <div class="color-swatch" style="background: #ef4444;" data-color="#ef4444"></div>
                    <div class="color-swatch" style="background: #ffffff; border: 1px solid #cbd5e1;" data-color="#ffffff"></div>
                    <div class="color-swatch" style="background: #000000;" data-color="#000000"></div>
                </div>
            </div>
            <div class="control-group" style="margin-top: 15px;">
                <label>Canvas Background</label>
                <div class="color-grid" id="bg-color-grid">
                    <div class="color-swatch active" style="background: #ffffff; border: 1px solid #cbd5e1;" data-color="#ffffff"></div>
                    <div class="color-swatch" style="background: #f1f5f9;" data-color="#f1f5f9"></div>
                    <div class="color-swatch" style="background: #0f172a;" data-color="#0f172a"></div>
                    <div class="color-swatch" style="background: #1e1b4b;" data-color="#1e1b4b"></div>
                    <div class="color-swatch" style="background: #451a03;" data-color="#451a03"></div>
                </div>
            </div>
        </div>

        <!-- 3. Logos Panel -->
        <div class="tool-panel" id="logos-panel">
            <div class="panel-title">Ready-Made Logos</div>
            <div class="preset-grid">
                <div class="preset-card" data-type="logo" data-svg='<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>'>
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <span>Tech Crown</span>
                </div>
                <div class="preset-card" data-type="logo" data-svg='<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'>
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span>Fashion Heart</span>
                </div>
                <div class="preset-card" data-type="logo" data-svg='<svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>'>
                    <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
                    <span>Layer Brand</span>
                </div>
                <div class="preset-card" data-type="logo" data-svg='<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'>
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <span>Global Globe</span>
                </div>
            </div>
        </div>

        <!-- 4. Shapes Panel -->
        <div class="tool-panel" id="shapes-panel">
            <div class="panel-title">Shapes, Lines & Outlines</div>
            <div class="preset-grid">
                <div class="preset-card" data-type="shape" data-svg='<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>'>
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    <span>Square Box</span>
                </div>
                <div class="preset-card" data-type="shape" data-svg='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>'>
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    <span>Circle Outline</span>
                </div>
                <div class="preset-card" data-type="shape" data-svg='<svg viewBox="0 0 24 24"><polygon points="12 2 22 20 2 20" fill="none" stroke="currentColor" stroke-width="2"/></svg>'>
                    <svg viewBox="0 0 24 24"><polygon points="12 2 22 20 2 20" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    <span>Triangle Angle</span>
                </div>
                <div class="preset-card" data-type="shape" data-svg='<svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="3"/></svg>'>
                    <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="3"/></svg>
                    <span>Divider Line</span>
                </div>
            </div>
        </div>

        <!-- Workspace Area -->
        <div class="workspace" id="workspace">
            <div class="canvas-container" id="canvas">
                <!-- Default Initial Element -->
                <div class="canvas-element selected" style="top: 200px; left: 120px;" id="default-element">
                    <span class="canvas-text" style="font-family: 'Poppins', sans-serif; color: #0f172a;">Mimi Design</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab Navigation Logic
        const toolBtns = document.querySelectorAll('.tool-btn');
        const toolPanels = document.querySelectorAll('.tool-panel');

        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolBtns.forEach(b => b.classList.remove('active'));
                toolPanels.forEach(p => p.classList.remove('active'));

                btn.classList.add('active');
                const targetPanel = document.getElementById(btn.getAttribute('data-target'));
                targetPanel.classList.add('active');
            });
        });

        // Workspace elements & selection handling
        const canvas = document.getElementById('canvas');
        let activeElement = document.getElementById('default-element');
        let currentColor = '#0f172a';

        // Make elements selectable & draggable inside canvas
        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY;

            element.addEventListener('mousedown', (e) => {
                selectElement(element);
                isDragging = true;
                startX = e.clientX - element.offsetLeft;
                startY = e.clientY - element.offsetTop;
                e.stopPropagation();
            });

            element.addEventListener('touchstart', (e) => {
                selectElement(element);
                isDragging = true;
                startX = e.touches[0].clientX - element.offsetLeft;
                startY = e.touches[0].clientY - element.offsetTop;
                e.stopPropagation();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                element.style.left = (e.clientX - startX) + 'px';
                element.style.top = (e.clientY - startY) + 'px';
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                element.style.left = (e.touches[0].clientX - startX) + 'px';
                element.style.top = (e.touches[0].clientY - startY) + 'px';
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('touchend', () => { isDragging = false; });
        }

        function selectElement(el) {
            document.querySelectorAll('.canvas-element').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            activeElement = el;
        }

        document.querySelectorAll('.canvas-element').forEach(makeDraggable);

        // Add Text Feature
        const textInput = document.getElementById('text-input');
        const fontSelect = document.getElementById('font-select');
        const fontSizeRange = document.getElementById('font-size-range');
        const textOpacityRange = document.getElementById('text-opacity-range');
        const addTextBtn = document.getElementById('add-text-btn');

        addTextBtn.addEventListener('click', () => {
            const newEl = document.createElement('div');
            newEl.className = 'canvas-element selected';
            newEl.style.top = '150px';
            newEl.style.left = '150px';
            
            const span = document.createElement('span');
            span.className = 'canvas-text';
            span.textContent = textInput.value || 'Your Text';
            span.style.fontFamily = fontSelect.value;
            span.style.fontSize = fontSizeRange.value + 'px';
            span.style.color = currentColor;
            span.style.opacity = textOpacityRange.value;

            newEl.appendChild(span);
            canvas.appendChild(newEl);
            makeDraggable(newEl);
            selectElement(newEl);
        });

        // Live text updating if active element is text
        textInput.addEventListener('input', () => {
            if (activeElement && activeElement.querySelector('.canvas-text')) {
                activeElement.querySelector('.canvas-text').textContent = textInput.value;
            }
        });

        fontSelect.addEventListener('change', () => {
            if (activeElement && activeElement.querySelector('.canvas-text')) {
                activeElement.querySelector('.canvas-text').style.fontFamily = fontSelect.value;
            }
        });

        fontSizeRange.addEventListener('input', () => {
            if (activeElement && activeElement.querySelector('.canvas-text')) {
                activeElement.querySelector('.canvas-text').style.fontSize = fontSizeRange.value + 'px';
            }
        });

        textOpacityRange.addEventListener('input', () => {
            if (activeElement) {
                activeElement.style.opacity = textOpacityRange.value;
            }
        });

        // Colors functionality
        const colorSwatches = document.querySelectorAll('#color-grid .color-swatch');
        colorSwatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                colorSwatches.forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                currentColor = swatch.getAttribute('data-color');
                if (activeElement) {
                    const txt = activeElement.querySelector('.canvas-text');
                    if (txt) txt.style.color = currentColor;
                    const svg = activeElement.querySelector('svg');
                    if (svg) svg.style.color = currentColor;
                }
            });
        });

        const bgColorSwatches = document.querySelectorAll('#bg-color-grid .color-swatch');
        bgColorSwatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                bgColorSwatches.forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                canvas.style.backgroundColor = swatch.getAttribute('data-color');
            });
        });

        // Preset Logos & Shapes functionality
        const presetCards = document.querySelectorAll('.preset-card');
        presetCards.forEach(card => {
            card.addEventListener('click', () => {
                const svgContent = card.getAttribute('data-svg');
                const newEl = document.createElement('div');
                newEl.className = 'canvas-element selected';
                newEl.style.top = '150px';
                newEl.style.left = '180px';
                newEl.style.width = '100px';
                newEl.style.height = '100px';
                newEl.style.color = currentColor;
                newEl.innerHTML = svgContent;

                canvas.appendChild(newEl);
                makeDraggable(newEl);
                selectElement(newEl);
            });
        });

        // Clear & Export actions
        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Clear your entire design workspace?')) {
                canvas.innerHTML = '';
            }
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            alert('Your Mimi Designer canvas is ready! (Tip: Take a screenshot or deploy your code to GitHub Pages to test live on your phone.)');
        });
    </script>
</body>
</html>
